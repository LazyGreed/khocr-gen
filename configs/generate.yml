# Rendering
height: 64
# width: null                         # omit for variable width
color-mode: 3                         # 1 = grayscale, 3 = RGB
fonts: fonts/
font-mode: random
copies: 3
mixed-font-prob: 0.5
retry-limit: 10
random-align-when-padded: false

# Variable line height (all optional; default is fixed --height for every image)
line-height-mode: bucketed            # fixed | variable | bucketed
min-line-height: 32
max-line-height: 96
line-height-step: 16
line-height-distribution: uniform     # uniform | triangular
# default-line-height: 48             # triangular peak; defaults to range midpoint
font-size-mode: proportional          # fixed | proportional
min-font-scale: 0.5
max-font-scale: 0.9
vertical-padding-mode: random         # fixed | random
min-vertical-padding-ratio: 0.04
max-vertical-padding-ratio: 0.18
record-metadata: true                 # write metadata.jsonl per split

# Text decoration (all optional; default 0 = disabled, each a probability in [0, 1])
text-deco-color-prob: 0.5             # random line color (RGB only; needs color-mode: 3)
text-deco-underline-prob: 0.2         # underline the whole line
text-deco-subscript-prob: 0.2         # lower 1-2 random ASCII chars
text-deco-superscript-prob: 0.2       # raise 1-2 random ASCII chars
text-deco-italic-prob: 0.3            # italic via real italic/oblique variant font
text-deco-bold-prob: 0.3              # bold via real bold variant font

# Corpus
corpus: corpus/corpus.txt
min-length: 1
max-length: 60
lines: 0                              # 0 = all
#val-percent: 10.0
#test-percent: 10.0                   # if only val-percent is set, test-percent is 0%
split-ratios: [80, 10, 10]            # overrides val-percent/test-percent
test-file: ""                         # separate test corpus; sole source of the test split when set
seed: 42
count-only: false                     # print filter stats + estimated image count, then exit
oversample-rare-chars: true           # extra copies of training lines containing rare chars
rare-char-percentile: 5.0             # least-frequent % of distinct chars considered rare
rare-char-multiplier: 3.0             # copy multiplier for lines containing a rare char
# image-dir: ""                       # bypass text rendering; corpus must be labels.txt

# Output
output: data/
append: false
overwrite: false
vocab: ""                             # auto-derived
skip-vocab: false
output-format: png                    # png | jpg | tiff
jpeg-quality: 90                      # JPEG quality for jpg output
storage: both                         # raw | lmdb | both

# LMDB Packing
pack-lmdb: false                      # pack generated dataset into LMDB after generation
keep-raw: false                       # keep raw image files after LMDB packing
lmdb-jpeg-quality: 90                 # JPEG quality for LMDB-stored images
lmdb-map-size-gb: 256                 # LMDB map size in GiB
lmdb-verbose: false                   # print LMDB packing progress

# Workers
workers: 0                            # 0 = auto
worker-timeout: 300

# DPI
dpi-mode: native

# Rendering style
bg-color-mode: random                 # default | paper_tones | colored | dark_mode | gradient | random

# Text normalization
norm_unicode_norm: ""                 # skipped by default; khmernormalizer normalizes internally
norm_emoji_replacement: ""
norm_url_replacement: ""
norm_no_remove_zwsp: false
norm_no_fix_encoding: false
norm_no_uncurl_quotes: false
norm_no_fix_line_breaks: false
norm_passthrough: false

# Augmentation methods
# Each method: prob (0-1), min intensity (0-1), max intensity (0-1)
# One augmentation applied per image (isolated, not stacked)

sauvola-prob: 0.2
sauvola-min: 0.1
sauvola-max: 0.9

geo-warp-prob: 0.2
geo-warp-min: 0.1
geo-warp-max: 0.9

vertical-crop-prob: 0.0
vertical-crop-min: 0.1
vertical-crop-max: 0.9

blur-prob: 0.4
blur-min: 0.1
blur-max: 0.9

distortion-prob: 0.3
distortion-min: 0.1
distortion-max: 0.9

albu-noise-prob: 0.4
albu-noise-min: 0.1
albu-noise-max: 0.9

jpeg-compression-prob: 0.4
jpeg-compression-min: 0.1
jpeg-compression-max: 0.9

rotation-prob: 0.0
rotation-min: 0.1
rotation-max: 0.9

salt-pepper-prob: 0.15
salt-pepper-min: 0.1
salt-pepper-max: 0.9

background-texture-prob: 0.35
background-texture-min: 0.1
background-texture-max: 0.9

lowdpi-prob: 0.3
lowdpi-min: 0.1
lowdpi-max: 0.9

oversample-prob: 0.1
oversample-min: 0.1
oversample-max: 0.9

# Online augmentations (default disabled)
perspective-prob: 0.3
perspective-min: 0.1
perspective-max: 0.9

elastic-prob: 0.0
elastic-min: 0.1
elastic-max: 0.9

random-crop-prob: 0.0
random-crop-min: 0.1
random-crop-max: 0.9

online-blur-prob: 0.1
online-blur-min: 0.1
online-blur-max: 0.9

online-noise-prob: 0.3
online-noise-min: 0.1
online-noise-max: 0.9

hsv-prob: 0.4
hsv-min: 0.1
hsv-max: 0.9

reverse-prob: 0.3
reverse-min: 0.0
reverse-max: 1.0

brightness-contrast-prob: 0.3
brightness-contrast-min: 0.1
brightness-contrast-max: 0.9

pixelation-prob: 0.3
pixelation-min: 0.1
pixelation-max: 0.9

gradient-illumination-prob: 0.4
gradient-illumination-min: 0.1
gradient-illumination-max: 0.9

morphological-prob: 0.3
morphological-min: 0.1
morphological-max: 0.9

anisotropic-dilation-prob: 0.2
anisotropic-dilation-min: 0.1
anisotropic-dilation-max: 0.9
