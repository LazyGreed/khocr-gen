name: Publish to PyPI

on:
  push:
    tags: ["*"]
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only publish when a PyPI token is configured; skip otherwise so the
    # workflow never hard-fails on repos without publish access.
    if: github.event_name == 'workflow_dispatch' || secrets.PYPI_TOKEN != ''
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build sdist and wheel
        run: uv build

      - name: Publish to PyPI
        run: uv publish --token ${{ secrets.PYPI_TOKEN }}